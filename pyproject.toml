[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rudocground"
version = "0.1.0"
description = "Evaluation toolkit for document-grounded LLM answers"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2,<3",
  "python-docx>=1,<2",
  "openai>=1,<2",
  "google-genai>=1,<2",
]

[project.scripts]
rudocground = "rudocground.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["rudocground*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
